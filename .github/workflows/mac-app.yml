# Builds the Mac app (desktop/) on a Mac runner and publishes it as the "mac-app" release, so the
# landing page's "Download for Mac" button always gets the latest build:
#   https://github.com/itsharshhy/then-and-now-mumbai/releases/latest/download/Then-and-Now-mac.dmg
# The app is ad-hoc signed (Apple Silicon won't run it otherwise) but not notarized: that needs a
# paid Apple Developer account, so the first launch goes through "Open Anyway" in System Settings.
name: Mac app

on:
  push:
    branches: [main]
    paths: ["src/**", "public/**", "desktop/**", "package.json", "package-lock.json", ".github/workflows/mac-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Build the site
        run: |
          npm ci
          npm run build

      - name: Build the Mac app
        working-directory: desktop
        run: |
          npm ci
          npx electron-builder --mac --publish never -c.buildVersion=${{ github.run_number }}

      - name: Check the app is signed and the dmg mounts
        working-directory: desktop/dist
        run: |
          codesign --verify --deep --strict "mac-universal/Then & Now.app"
          hdiutil attach -nobrowse -mountpoint /tmp/tnm Then-and-Now-mac.dmg
          codesign --verify --deep --strict "/tmp/tnm/Then & Now.app"
          hdiutil detach /tmp/tnm
          unzip -q Then-and-Now-mac.zip -d unzipped
          codesign --verify --deep --strict "unzipped/Then & Now.app"

      - name: Move the mac-app tag to this commit
        run: |
          git tag -f mac-app
          git push -f origin mac-app

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-app
          name: Then & Now for Mac
          make_latest: true
          files: |
            desktop/dist/Then-and-Now-mac.dmg
            desktop/dist/Then-and-Now-mac.zip
          body: |
            **Then & Now for Mac** (Apple Silicon and Intel, macOS 11 or later). Built from ${{ github.sha }}.

            1. Download **Then-and-Now-mac.dmg**, open it and drag **Then & Now** into Applications.
            2. The first time you open it, macOS says it can't check the developer. Click **Done**, then open
               **System Settings > Privacy & Security**, scroll down and click **Open Anyway**. (On macOS 14 and
               older you can instead Control-click the app and choose **Open**.) After that it opens normally.

            The app ships the whole game inside it, so it plays offline. Multiplayer and the bazaar need a connection.
